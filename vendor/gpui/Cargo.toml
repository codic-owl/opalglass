[package]
name = "gpui"
version = "0.1.0"
edition = "2024"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"


[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "rand",
    "util/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
runtime_shaders = []
macos-blade = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "objc2",
    "objc2-metal",
]
wayland = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "ashpd",
    "cosmic-text",
    "font-kit",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "filedescriptor",
    "xkbcommon",
    "open",
]
x11 = [
    "blade-graphics",
    "blade-macros",
    "blade-util",
    "bytemuck",
    "ashpd",
    "cosmic-text",
    "font-kit",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = []

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
anyhow = { "version" = "1.0.86" }
async-task = "4.7"
backtrace = { version = "0.3", optional = true }
blade-graphics = { "version" = "0.7.0", "optional" = true }
blade-macros = { "version" = "0.3.0", "optional" = true }
blade-util = { "version" = "0.3.0", "optional" = true }
bytemuck = { version = "1", optional = true }
collections = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
ctor = { "version" = "0.4.0" }
derive_more = { "version" = "0.99.17" }
etagere = "0.2"
futures = { "version" = "0.3" }
gpui_macros = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
http_client = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
image = { "version" = "0.25.1" }
inventory = { "version" = "0.3.19" }
itertools = { "version" = "0.14.0" }
log = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
num_cpus = "1.13"
parking = "2.0.0"
parking_lot = { "version" = "0.12.1" }
postage = { "version" = "0.5", "features" = ["futures-traits"] }
profiling = { "version" = "1" }
rand = { "version" = "0.9", "optional" = true }
raw-window-handle = "0.6"
refineable = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
resvg = { version = "0.45.0", default-features = false, features = [
    "text",
    "system-fonts",
    "memmap-fonts",
] }
usvg = { version = "0.45.0", default-features = false }
util_macros = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
schemars = { "version" = "1.0", "features" = ["indexmap2"] }
seahash = "4.1"
semantic_version = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
serde = { "version" = "1.0.221", "features" = ["derive", "rc"] }
serde_json = { "version" = "1.0.144", "features" = ["preserve_order", "raw_value"] }
slotmap = { "version" = "1.0.6" }
smallvec = { "version" = "1.6", "features" = ["union"] }
smol = { "version" = "2.0" }
stacksafe = { "version" = "0.1" }
strum = { "version" = "0.27.0", "features" = ["derive"] }
sum_tree = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
taffy = "=0.9.0"
thiserror = { "version" = "2.0.12" }
util = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
uuid = { "version" = "1.1.2", "features" = ["v4", "v5", "v7", "serde"] }
waker-fn = "1.2.0"
lyon = "1.0"
workspace-hack = "0.1.0"
libc = { "version" = "0.2" }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
cocoa = { "version" = "0.26" }
core-foundation = "0.10.0"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-video = { "version" = "0.4.3", "features" = ["metal"] }
core-text = "21"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "5474cfad4b719a72ec8ed2cb7327b2b01fd10568", optional = true }
foreign-types = "0.5"
log = { "version" = "0.4.16", "features" = ["kv_unstable_serde", "serde"] }
media = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8" }
objc = { "version" = "0.2" }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
#TODO: replace with "objc2"
metal = { "version" = "0.29" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
pathfinder_geometry = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
scap = { "git" = "https://github.com/zed-industries/scap", "rev" = "808aa5c45b41e8f44729d02e38fd00a2fe2722e7", "default-features" = false, "optional" = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# Always used
flume = "0.11"
oo7 = { version = "0.5.0", default-features = false, features = [
    "async-std",
    "native_crypto",
] }

# Used in both windowing options
ashpd = { "version" = "0.11", "default-features" = false, "features" = ["async-std"], "optional" = true }
blade-graphics = { "version" = "0.7.0", "optional" = true }
blade-macros = { "version" = "0.3.0", "optional" = true }
blade-util = { "version" = "0.3.0", "optional" = true }
bytemuck = { version = "1", optional = true }
cosmic-text = { version = "0.14.0", optional = true }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "5474cfad4b719a72ec8ed2cb7327b2b01fd10568", features = [
    "source-fontconfig-dlopen",
], optional = true }

calloop = { version = "0.13.0" }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }

# Wayland
calloop-wayland-source = { version = "0.3.0", optional = true }
wayland-backend = { version = "0.3.3", features = [
    "client_system",
    "dlopen",
], optional = true }
wayland-client = { version = "0.31.2", optional = true }
wayland-cursor = { version = "0.31.1", optional = true }
wayland-protocols = { version = "0.31.2", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.2.0", features = [
    "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
], optional = true }
xkbcommon = { version = "0.8.0", features = [
    "wayland",
    "x11",
], optional = true }
xim = { git = "https://github.com/zed-industries/xim-rs", rev = "c0a70c1bd2ce197364216e5e818a2cb3adb99a8d" , features = [
    "x11rb-xcb",
    "x11rb-client",
], optional = true }
x11-clipboard = { version = "0.9.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
flume = "0.11"
rand = { "version" = "0.9" }
windows = { "version" = "0.61", "features" = ["Foundation_Numerics", "Storage_Search", "Storage_Streams", "System_Threading", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Hlsl", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
windows-numerics = "0.2"
windows-registry = "0.5"

[dev-dependencies]
backtrace = "0.3"
collections = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8", "features" = ["test-support"] }
env_logger = { "version" = "0.11" }
http_client = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8", "features" = ["test-support"] }
lyon = { version = "1.0", features = ["extra"] }
pretty_assertions = { "version" = "1.3.0", "features" = ["unstable"] }
rand = { "version" = "0.9" }
reqwest_client = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8", "features" = ["test-support"] }
unicode-segmentation = "1.10"
util = { "git" = "https://github.com/zed-industries/zed", "rev" = "3314de81755d7ef949007f6b804f4496092b0cc8", "features" = ["test-support"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.71"
cbindgen = { version = "0.28.0", default-features = false }
naga = { "version" = "25.0", "features" = ["wgsl-in"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.build-dependencies]
naga = { "version" = "25.0", "features" = ["wgsl-in"] }


[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "image"
path = "examples/image/image.rs"

[[example]]
name = "input"
path = "examples/input.rs"

[[example]]
name = "on_window_close_quit"
path = "examples/on_window_close_quit.rs"

[[example]]
name = "opacity"
path = "examples/opacity.rs"

[[example]]
name = "pattern"
path = "examples/pattern.rs"

[[example]]
name = "set_menus"
path = "examples/set_menus.rs"

[[example]]
name = "shadow"
path = "examples/shadow.rs"

[[example]]
name = "svg"
path = "examples/svg/svg.rs"

[[example]]
name = "tab_stop"
path = "examples/tab_stop.rs"

[[example]]
name = "text"
path = "examples/text.rs"

[[example]]
name = "text_wrapper"
path = "examples/text_wrapper.rs"

[[example]]
name = "tree"
path = "examples/tree.rs"

[[example]]
name = "uniform_list"
path = "examples/uniform_list.rs"

[[example]]
name = "window_shadow"
path = "examples/window_shadow.rs"

[[example]]
name = "grid_layout"
path = "examples/grid_layout.rs"

[workspace]
