[package]
name = "opalglass-tantivy-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
serde_json = "=1.0.145"
levenshtein_automata = "=0.2.1"
tantivy-fst = "=0.5.0"

[profile.release]
lto = "thin"
codegen-units = 1
