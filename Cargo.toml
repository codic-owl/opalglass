[package]
name = "opalglass"
version = "0.1.0"
edition = "2024"
description = "A local-first Markdown workspace, built with Rust and GPUI"
license = "MIT"

[dependencies]
opalglass-search = { path = "crates/search" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "3314de81755d7ef949007f6b804f4496092b0cc8" }
unicode-segmentation = "=1.12.0"
tempfile = "=3.23.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rustix = { version = "=1.1.2", features = ["fs"] }

[profile.dev]
debug = 0

# Keep `cargo run` responsive too: text indexing and GPUI's layout trees are
# prohibitively slow without optimization. Other dependencies retain fast builds.
[profile.dev.package.opalglass]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 2

# The native Linux renderer calls these crates for font shaping, glyph
# rasterization and layout. Optimizing GPUI alone leaves this work unoptimized;
# the simulated UI platform does not exercise the native font stack.
[profile.dev.package.cosmic-text]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

[profile.dev.package.taffy]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["crates/search"]
exclude = ["ui-tests", "prototypes/tantivy-search"]
