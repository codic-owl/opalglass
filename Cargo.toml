[package]
name = "opalglass"
version = "0.1.0"
edition = "2024"
description = "A local-first Markdown workspace, built with Rust and GPUI"
license = "MIT"

[dependencies]
opalglass-search = { path = "crates/search" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "3314de81755d7ef949007f6b804f4496092b0cc8" }
unicode-segmentation = "=1.12.0"
tempfile = "=3.23.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["local-offset"] }
mimalloc = "=0.1.52"
serde_yaml_ng = "=0.10.0"
similar = "=2.7.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
linkify = "=0.11.0"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
resvg = { version = "=0.45.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "=0.20.0"
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "951c770a32f1998d6e999cef3e59e0013e6c4415", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "net", "time", "sync"] }
futures = "=0.3.31"
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.2", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.1", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
# Optimize all runtime dependencies so native rendering stays responsive.
# Keep the target's default CPU baseline for portable builds.
opt-level = 2
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["crates/search"]
exclude = ["ui-tests", "prototypes/tantivy-search"]
