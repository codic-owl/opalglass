name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      # Target defaults on every architecture; no host-specific CPU instructions.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev fonts-dejavu-core
      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'The Windows SDK fxc.exe shader compiler is missing.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path ui-tests/Cargo.toml -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Native interface tests
        run: cargo test --locked --manifest-path ui-tests/Cargo.toml
      - name: Collect licenses and build native package
        run: |
          python scripts/dependency_notices.py
          python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: opalglass-${{ matrix.os }}
          path: target/packages/*
          if-no-files-found: error
