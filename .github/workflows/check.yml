name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      # Target defaults on every architecture; no host-specific CPU instructions.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # Reuse matching dependencies across the app and separate UI-test package.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev
          libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          libvulkan-dev fonts-dejavu-core
      - name: Locate Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'The Windows SDK fxc.exe shader compiler is missing.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # This graph includes all app dependencies. List the shared target once
          # so separate cleanup passes cannot remove each other's cached crates.
          workspaces: ui-tests -> ../target
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/search/Cargo.toml', 'ui-tests/Cargo.toml', 'ui-tests/Cargo.lock') }}
          env-vars: MACOSX_DEPLOYMENT_TARGET GPUI_FXC_PATH SDKROOT DEVELOPER_DIR
          cache-on-failure: true
          cache-bin: false
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path ui-tests/Cargo.toml -- --check
      - name: Release script tests
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s scripts/tests
      - name: Lint workspace
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Interface tests
        # Independent simulated event loops share process-wide loader limits.
        run: cargo test --locked --manifest-path ui-tests/Cargo.toml -- --test-threads=1
      - name: Build release application
        run: cargo build --release --locked
      - name: Collect dependency licenses
        run: python scripts/dependency_notices.py
      - name: Build native package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: opalglass-${{ matrix.os }}
          path: target/packages/*
          if-no-files-found: error
